name: Build APK de teste

# Gera o APK de teste do ZAP STATION na nuvem (o GitHub já tem Flutter e Android SDK).
# Rode manualmente em Actions > "Build APK de teste" > Run workflow, ou a cada push na main.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Completar o projeto Android (gradle wrapper)
        # Cria só o que falta (ex.: gradle-wrapper.jar); não sobrescreve arquivos existentes.
        run: |
          flutter create . --platforms=android --org com.zapstation --project-name zap_station
          rm -f test/widget_test.dart   # teste de exemplo gerado pelo flutter create
          git status --short

      - run: flutter --version
      - run: flutter pub get

      # O APK é gerado ANTES de analyze/test para você poder instalar mesmo que um teste falhe
      # (o código Dart ainda não tinha sido compilado quando foi escrito).
      - name: Compilar APK (debug)
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=APP_ENV=test

      - uses: actions/upload-artifact@v4
        with:
          name: zap-station-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Analisar
        run: flutter analyze

      - name: Testes
        run: flutter test

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrações + testes de RLS
        run: supabase/tests/run_local.sh

name: Build APK de teste

# Gera o APK de teste do ZAP STATION na nuvem (o GitHub já tem Flutter e Android SDK).
# Rode manualmente em Actions > "Build APK de teste" > Run workflow, ou a cada push na main.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar pasta de logs
        run: mkdir -p "$RUNNER_TEMP/logs"

      - name: Completar o projeto Android (gradle wrapper)
        # Cria só o que falta (ex.: gradle-wrapper.jar); não sobrescreve arquivos existentes.
        run: |
          set -o pipefail
          {
            flutter create . --platforms=android --org com.zapstation --project-name zap_station
            rm -f test/widget_test.dart   # teste de exemplo gerado pelo flutter create
            rm -rf android/app/src/main/kotlin/com/zapstation/zap_station   # MainActivity duplicada gerada pelo template
            git status --short
          } 2>&1 | tee "$RUNNER_TEMP/logs/01-create.log"

      - name: Versões
        run: flutter --version

      - name: flutter pub get
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee "$RUNNER_TEMP/logs/02-pub-get.log"

      # O APK é gerado ANTES de analyze/test para você poder instalar mesmo que um teste falhe
      # (o código Dart ainda não tinha sido compilado quando foi escrito).
      - name: Compilar APK (debug)
        run: |
          set -o pipefail
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=APP_ENV=test 2>&1 | tee "$RUNNER_TEMP/logs/03-build.log"

      - uses: actions/upload-artifact@v4
        with:
          name: zap-station-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Analisar
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee "$RUNNER_TEMP/logs/04-analyze.log"

      - name: Testes
        run: |
          set -o pipefail
          flutter test 2>&1 | tee "$RUNNER_TEMP/logs/05-test.log"

      # Em caso de falha, publica o final de cada log como "annotation" (visível na página da execução).
      - name: Resumo do erro
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, os, re
          for path in sorted(glob.glob(os.path.join(os.environ["RUNNER_TEMP"], "logs", "*.log"))):
              lines = open(path, errors="replace").read().splitlines()
              key = [l for l in lines if re.search(r"(error|Error|FAILURE|What went wrong|Execution failed|Could not|Exception|\be: |\[E\])", l)]
              text = "\n".join(key[:50]) + "\n--- final do log ---\n" + "\n".join(lines[-40:])
              text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::error title=" + os.path.basename(path) + "::" + text[:3800])
          EOF

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrações + testes de RLS
        run: supabase/tests/run_local.sh
